version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: proofly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofly
      POSTGRES_PASSWORD: proofly_secret_password
      POSTGRES_DB: proofly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofly"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: proofly-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://proofly:proofly_secret_password@db:5432/proofly
      JWT_SECRET: production-jwt-secret-replace-in-env-file-min-32-chars
      WEB_BASE_URL: http://localhost:3000
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: proofly-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
