services:
  # 1. PostgreSQL Managed Database
  - type: postgres
    name: proofly-db
    plan: free
    ipAllowList: []

  # 2. FastAPI Backend Web Service
  - type: web
    name: proofly-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install hatchling && pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proofly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_BASE_URL
        value: https://proofly-web.onrender.com

  # 3. Next.js Frontend Web Service
  - type: web
    name: proofly-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://proofly-api.onrender.com/api/v1

